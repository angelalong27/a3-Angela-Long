<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='/main.js'></script>
    <link rel='stylesheet' href='/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>

    <h1>Reading Tracker</h1>
    <form>
      <label for='book'>Book:</label>
      <input type='text' id='book' placeholder='Book title'>

      <label for='author'>Author:</label>
      <input type='text' id='author' placeholder='Author'>

      <label for='pagesRead'>Pages Read:</label>
      <input type='number' id='pagesRead' placeholder='Pages Read'>

      <label for='totalPages'>Total Pages:</label>
      <input type='number' id='totalPages' placeholder='Total Pages'>

      <label for='status'>Reading Status:</label>
      <select id='status'>
        <option value='tbr'>Want to Read (TBR)</option>
        <option value='currently-reading'>Currently Reading</option>
        <option value='finished'>Finished</option>
      </select>
      
      <fieldset>
        <legend>Book Format:</legend>
        
        <input type='radio' id='physical' name='format' value='Physical'>
        <label for='physical'>Physical</label>
         <input type='radio' id='ebook' name='format' value='Ebook'>
         <label for='ebook'>Ebook</label>
         <input type='radio' id='audiobook' name='format' value='Audiobook'>
         <label for='audiobook'>Audiobook</label>
        </fieldset>
        
        <fieldset>
          <legend>Rating:</legend>
          <input type='radio' id='rating1' name='rating' value='1'>
          <label for='rating1'>1</label>
          <input type='radio' id='rating2' name='rating' value='2'>
          <label for='rating2'>2</label>
          <input type='radio' id='rating3' name='rating' value='3'>
          <label for='rating3'>3</label>
          <input type='radio' id='rating4' name='rating' value='4'>
          <label for='rating4'>4</label>
          <input type='radio' id='rating5' name='rating' value='5'>
          <label for='rating5'>5</label>
        </fieldset>
        
        <label for='notes'>Notes / Review:</label>
        <textarea id='notes' placeholder='Write your thoughts about the book'></textarea>

        <button class="submitButton">Submit</button>
      </form>

    <h2>Currently Reading</h2>
    <table>
      <thead>
        <tr>
          <th>Book</th>
          <th>Author</th>
          <th>Pages Read</th>
          <th>Total Pages</th>
          <th>Percentage Read</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id='readingList'>
      </tbody>
    </table>
  </body>
</html>
